<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>오르빗 — 호기심으로 떠나는 우주 퀴즈</title>
  <style>
    :root {
      --bg: #f7f6f2; --card: #ffffff; --text: #292b36; --muted: #777983;
      --line: #e9e8e4; --accent: #7759cf; --soft: #f3effc; --orange: #ec754e;
      --green: #25835b; --green-bg: #edf8f1; --red: #c34d58; --red-bg: #fff0f1;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .page { width: min(100% - 40px, 520px); margin: 0 auto; padding: 35px 0 24px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 750; letter-spacing: -1px; }
    .brand svg { width: 31px; height: 31px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    .edition { font-size: 10px; color: var(--muted); letter-spacing: 1.8px; font-weight: 650; }
    .hero { text-align: center; padding: 29px 0 27px; }
    .space-art { display: block; width: 230px; height: 128px; margin: 0 auto 14px; overflow: visible; }
    .planet { transform-origin: 115px 65px; animation: float 6s ease-in-out infinite; }
    .spark { animation: twinkle 4s ease-in-out infinite alternate; }
    .eyebrow { color: var(--orange); font-size: 10px; font-weight: 750; letter-spacing: 2.4px; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 6vw, 35px); margin: 6px 0 7px; line-height: 1.25; font-weight: 750; letter-spacing: -1.4px; word-break: keep-all; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }
    .mission { display: flex; justify-content: center; gap: 17px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .mission span { display: inline-flex; gap: 6px; align-items: center; }
    .mission svg { width: 13px; height: 13px; }
    .tracker { margin: 0 3px 21px; }
    .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; font-size: 12px; }
    .stats strong { font-weight: 700; }
    .stats .total { color: var(--muted); }
    .score { display: flex; gap: 7px; align-items: center; color: var(--accent); }
    .score svg { width: 15px; height: 15px; }
    .track { height: 6px; background: var(--line); border-radius: 10px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: var(--accent); border-radius: inherit; transition: width .5s ease; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 29px; box-shadow: 0 8px 25px #292b3604; }
    .category { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; background: var(--soft); color: var(--accent); font-size: 10px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; }
    h2 { margin: 17px 0 7px; font-size: 23px; line-height: 1.4; letter-spacing: -.65px; font-weight: 700; word-break: keep-all; }
    #question {
      position: relative;
      padding: 26px 20px 20px;
      margin-bottom: 13px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 5px;
      background-color: var(--soft);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      line-height: 1.6;
      letter-spacing: -.4px;
      overflow-wrap: anywhere;
      box-shadow: inset 0 0 0 5px var(--soft);
    }
    #question::before {
      content: "";
      position: absolute;
      top: 10px;
      right: 12px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: -9px 0 0 var(--accent), -18px 0 0 var(--accent);
      pointer-events: none;
    }
    #question::after {
      content: "";
      position: absolute;
      right: 7px;
      bottom: 7px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      pointer-events: none;
    }
    #question:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .hint { color: var(--muted); font-size: 12px; margin: 0 0 22px; }
    .options { display: grid; gap: 10px; }
    .option { width: 100%; text-align: left; display: flex; align-items: center; gap: 13px; padding: 12px 14px; min-height: 53px; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px; cursor: pointer; transition: border-color .2s, background .2s, transform .2s; }
    .option:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); transform: translateX(3px); }
    .letter { display: grid; place-items: center; width: 27px; height: 27px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .option-label { flex: 1; font-size: 14px; }
    .mark { font-size: 17px; font-weight: 700; }
    .option:disabled { cursor: default; }
    .option.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); animation: celebrate .45s ease; }
    .option.correct .letter { background: var(--green); border-color: var(--green); color: white; }
    .option.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); animation: shake .4s ease; }
    .option.wrong .letter { background: var(--red); border-color: var(--red); color: white; }
    .feedback { margin-top: 17px; padding: 12px 14px; border-radius: 10px; font-size: 12px; animation: reveal .3s ease; }
    .feedback.good { background: var(--green-bg); color: var(--green); }
    .feedback.bad { background: var(--red-bg); color: var(--red); }
    .feedback strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .card-bottom { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 19px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .status { color: var(--muted); font-size: 11px; }
    .primary { padding: 10px 17px; border: 0; border-radius: 8px; background: var(--accent); color: white; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s; }
    .primary:hover:not(:disabled) { background: #6246b3; transform: translateY(-1px); }
    .primary:disabled { background: var(--soft); color: var(--muted); cursor: default; }
    .arrow { margin-left: 13px; }
    .note { display: flex; justify-content: center; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; margin: 19px 0 29px; }
    .note svg { width: 13px; height: 13px; }
    footer { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 10px; }
    footer span:last-child { letter-spacing: .2px; }
    .results { text-align: center; }
    .reaction { font-size: 57px; line-height: 1; margin: 8px 0 22px; animation: celebrate .6s ease; }
    .results h2 { font-size: 27px; margin-top: 12px; }
    .result-copy { color: var(--muted); font-size: 14px; margin: 10px 0 24px; }
    .result-number { font-size: 62px; color: var(--accent); font-weight: 750; letter-spacing: -3px; line-height: 1.2; }
    .result-number span { color: var(--muted); font-size: 25px; letter-spacing: -1px; }
    .result-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .result-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-block: 1px solid var(--line); margin: 25px 0; padding: 17px 0; }
    .result-summary strong { display: block; font-size: 20px; }
    .result-summary span { color: var(--muted); font-size: 11px; }
    .results .primary { width: 100%; font-size: 14px; padding: 13px; }
    .question-enter { animation: reveal .35s ease; }
    @keyframes float { 50% { transform: translateY(-6px) rotate(-3deg); } }
    @keyframes twinkle { to { opacity: .3; } }
    @keyframes celebrate { 50% { transform: scale(1.025); } }
    @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171820; --card: #20212c; --text: #f0edf6; --muted: #a2a0af; --line: #343440; --accent: #b69aef; --soft: #30283f; --orange: #f29672; --green: #7ed7ab; --green-bg: #20382f; --red: #f58f99; --red-bg: #3e252c; color-scheme: dark; }
      .primary { background: #8461ca; }
      .option.correct .letter, .option.wrong .letter { color: #171820; }
    }
    @media (max-width: 420px) {
      .page { width: calc(100% - 28px); padding-top: 23px; }
      .card { padding: 22px; }
      .hero { padding-top: 22px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      h2 { font-size: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="8" fill="currentColor"/><ellipse cx="16" cy="16" rx="16" ry="5" transform="rotate(-35 16 16)" stroke="var(--orange)" stroke-width="2.2"/><circle cx="27" cy="6" r="2" fill="var(--orange)"/></svg>
        오르빗<span style="color:var(--orange)">.</span>
      </div>
      <span class="edition">호기심 시리즈 / 001</span>
    </header>
    <section class="hero" aria-labelledby="title">
      <svg class="space-art" viewBox="0 0 230 128" fill="none" aria-hidden="true">
        <circle cx="115" cy="65" r="59" stroke="var(--line)" stroke-dasharray="3 5"/>
        <circle cx="115" cy="65" r="47" stroke="var(--line)"/>
        <g class="planet">
          <defs><linearGradient id="planet-color" x1="77" y1="28" x2="151" y2="103" gradientUnits="userSpaceOnUse"><stop stop-color="#c5aff1"/><stop offset="1" stop-color="#7755c4"/></linearGradient><clipPath id="planet-clip"><circle cx="115" cy="65" r="35"/></clipPath></defs>
          <ellipse cx="115" cy="65" rx="65" ry="16" transform="rotate(-24 115 65)" stroke="#eda581" stroke-width="9"/>
          <circle cx="115" cy="65" r="35" fill="url(#planet-color)"/>
          <g clip-path="url(#planet-clip)" stroke="#dfcff8" stroke-opacity=".3" stroke-width="8">
            <path d="M74 43 Q112 65 156 40"/><path d="M72 64 Q117 90 156 63"/><path d="M82 91 Q123 103 155 83"/>
          </g>
          <path d="M57 90 C71 100 117 91 157 71 C176 61 180 53 174 46" stroke="#f2b394" stroke-width="9" stroke-linecap="round"/>
        </g>
        <g class="spark" fill="var(--orange)"><path d="M42 31 L44 36 L49 38 L44 40 L42 45 L40 40 L35 38 L40 36 Z"/><circle cx="190" cy="94" r="3"/><circle cx="170" cy="20" r="2"/></g>
        <g fill="var(--accent)"><path d="M195 40 L197 44 L201 46 L197 48 L195 52 L193 48 L189 46 L193 44 Z"/><circle cx="50" cy="99" r="2"/><circle cx="25" cy="72" r="1.5"/></g>
      </svg>
      <div class="eyebrow">우주가 궁금한 당신에게</div>
      <h1 id="title">우주, 얼마나 알고 있나요?</h1>
      <p>작은 호기심으로 시작하는 커다란 발견.</p>
      <div class="mission">
        <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="2" width="10" height="12" rx="2" stroke="currentColor"/><path d="M5 6h6M5 9h6" stroke="currentColor"/></svg>총 10문제</span>
        <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor"/><path d="M8 4v4l3 2" stroke="currentColor"/></svg>약 3분</span>
        <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m8 1 2 4 4 2-4 2-2 5-2-5-4-2 4-2Z" stroke="currentColor"/></svg>끝없는 발견</span>
      </div>
    </section>
    <section class="tracker" aria-label="퀴즈 진행 상황">
      <div class="stats">
        <span id="question-count"><strong>문제 01</strong><span class="total"> / 10</span></span>
        <span class="score" aria-live="polite"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m9 2 2 4.2 4.6.7-3.3 3.2.8 4.6L9 12.5l-4.1 2.2.8-4.6L2.4 6.9l4.6-.7Z" stroke="currentColor" stroke-width="1.4"/></svg><strong id="score">0점</strong></span>
      </div>
      <div class="track" role="progressbar" aria-label="답변한 문제 수" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="fill" id="progress"></div></div>
    </section>
    <section class="card" id="quiz" aria-labelledby="question">
      <div id="question-content">
        <span class="category" id="category"></span>
        <h2 id="question" tabindex="-1"></h2>
        <p class="hint">정답을 골라보세요. 당신의 탐험 본능을 믿어봐요.</p>
        <div class="options" id="options"></div>
      </div>
      <div id="feedback" class="feedback" role="status" hidden></div>
      <div class="card-bottom">
        <span class="status" id="status">한 걸음씩 우주 속으로.</span>
        <button class="primary" id="next" disabled>다음 문제 <span class="arrow" aria-hidden="true">→</span></button>
      </div>
    </section>
    <section class="card results" id="results" aria-labelledby="result-title" hidden>
      <div class="reaction" id="reaction" aria-hidden="true"></div>
      <span class="eyebrow">탐험 완료</span>
      <h2 id="result-title" tabindex="-1"></h2>
      <p class="result-copy" id="result-copy"></p>
      <div class="result-number" id="result-number"></div>
      <div class="result-label">나의 우주 탐험 점수</div>
      <div class="result-summary">
        <div><strong id="correct-count" style="color:var(--green)"></strong><span>맞힌 문제</span></div>
        <div><strong id="wrong-count" style="color:var(--red)"></strong><span>틀린 문제</span></div>
        <div><strong id="accuracy"></strong><span>정답률</span></div>
      </div>
      <button class="primary" id="restart">다시 탐험하기 <span class="arrow" aria-hidden="true">↻</span></button>
    </section>
    <p class="note"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 11h4M6 14h4M5 8a4 4 0 1 1 6 0l-1 2H6Z" stroke="currentColor" stroke-linecap="round"/></svg>괜찮아요. 별도 빛나기까지 시간이 필요하니까요.</p>
    <footer><span>우주에는 배울 것이 가득해요.</span><span>호기심 많은 당신을 위해 ✦</span></footer>
  </main>
  <script>
    const questions = [
      { category: "우리 태양계", question: "'붉은 행성'이라고 불리는 행성은 무엇일까요?", options: ["금성", "화성", "목성", "토성"], answer: 1, fact: "화성이 붉게 보이는 이유는 토양 속 산화철 때문이에요. 지구에서 철에 녹이 슬 때 생기는 물질과 같답니다." },
      { category: "인류의 위대한 도약", question: "달 위를 처음으로 걸은 사람은 누구일까요?", options: ["유리 가가린", "버즈 올드린", "닐 암스트롱", "앨런 셰퍼드"], answer: 2, fact: "닐 암스트롱은 1969년 7월 20일, 미국 항공우주국의 아폴로 11호 임무 중 달에 첫발을 내디뎠어요." },
      { category: "거대한 행성", question: "태양계에서 가장 큰 행성은 무엇일까요?", options: ["지구", "해왕성", "토성", "목성"], answer: 3, fact: "목성의 부피는 지구 1,300개 이상을 담을 수 있을 만큼 거대해요." },
      { category: "우주 개척의 시작", question: "인류가 최초로 궤도에 쏘아 올린 인공위성은 무엇일까요?", options: ["스푸트니크 1호", "보이저 1호", "익스플로러 1호", "아폴로 1호"], answer: 0, fact: "소련은 1957년 10월 4일 스푸트니크 1호를 발사했어요. 이 사건으로 본격적인 우주 시대가 열렸답니다." },
      { category: "달 탐사", question: "인류 최초로 달 착륙에 성공한 아폴로 임무는 무엇일까요?", options: ["아폴로 8호", "아폴로 11호", "아폴로 13호", "아폴로 17호"], answer: 1, fact: "아폴로 11호의 닐 암스트롱과 버즈 올드린은 달에 착륙했고, 마이클 콜린스는 달 궤도를 돌고 있었어요." },
      { category: "궤도 위의 일상", question: "국제우주정거장의 우주비행사들이 둥둥 떠다니는 이유는 무엇일까요?", options: ["우주에는 중력이 없어서", "우주복이 중력을 밀어내서", "정거장과 함께 계속 자유 낙하해서", "정거장이 지구 중력의 범위 밖에 있어서"], answer: 2, fact: "국제우주정거장에도 지구의 중력이 작용해요. 정거장과 우주비행사가 함께 지구를 향해 계속 떨어지며 궤도를 돌기 때문에 무중력처럼 느껴진답니다." },
      { category: "깊은 우주", question: "우리 태양계가 속한 은하는 무엇일까요?", options: ["안드로메다은하", "우리은하", "삼각형자리은하", "소용돌이은하"], answer: 1, fact: "우리 태양계는 우리은하의 오리온 팔에 있어요. 은하 중심에서 약 26,000광년 떨어져 있답니다." },
      { category: "로봇 탐험가", question: "탐사 로버 퍼서비어런스가 2021년에 착륙한 행성은 무엇일까요?", options: ["수성", "금성", "달", "화성"], answer: 3, fact: "퍼서비어런스는 화성의 예제로 충돌구에 착륙했어요. 고대 미생물의 흔적을 찾고 암석 표본을 수집하고 있답니다." },
      { category: "눈에 보이지 않는 빛", question: "제임스 웹 우주망원경은 주로 어떤 빛을 관측할까요?", options: ["적외선", "전파", "엑스선", "자외선"], answer: 0, fact: "제임스 웹 우주망원경은 적외선을 관측해요. 우주 먼지 너머를 들여다보고 아주 오래된 은하의 빛을 연구할 수 있답니다." },
      { category: "태양계 너머로", question: "최초로 성간 공간에 진입한 우주탐사선은 무엇일까요?", options: ["뉴허라이즌스호", "카시니호", "보이저 1호", "파이어니어 10호"], answer: 2, fact: "보이저 1호는 2012년 태양권계면을 통과했어요. 태양풍이 만드는 거품 같은 영역을 벗어나 별과 별 사이의 공간에 진입했답니다." }
    ];
    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;

    function updateProgress(completed) {
      $("progress").style.width = `${completed / questions.length * 100}%`;
      document.querySelector('[role="progressbar"]').setAttribute("aria-valuenow", completed);
      $("score").textContent = `${score}점`;
    }

    function showQuestion(focus = false) {
      answered = false;
      const item = questions[current];
      $("question-count").innerHTML = `<strong>문제 ${String(current + 1).padStart(2, "0")}</strong><span class="total"> / ${questions.length}</span>`;
      $("category").textContent = `✦ ${item.category}`;
      $("question").textContent = item.question;
      $("options").replaceChildren();
      item.options.forEach((label, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.innerHTML = `<span class="letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="option-label"></span><span class="mark" aria-hidden="true"></span>`;
        button.querySelector(".option-label").textContent = label;
        button.addEventListener("click", () => chooseAnswer(index));
        $("options").append(button);
      });
      $("feedback").hidden = true;
      $("next").disabled = true;
      $("next").innerHTML = `${current === questions.length - 1 ? "결과 보기" : "다음 문제"} <span class="arrow" aria-hidden="true">→</span>`;
      $("status").textContent = "한 걸음씩 우주 속으로.";
      $("question-content").classList.remove("question-enter");
      void $("question-content").offsetWidth;
      $("question-content").classList.add("question-enter");
      if (focus) $("question").focus({ preventScroll: true });
    }

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const correct = selected === item.answer;
      if (correct) score++;
      const buttons = [...$("options").children];
      buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) {
          button.classList.add("correct");
          button.querySelector(".mark").textContent = "✓";
          button.setAttribute("aria-label", `${item.options[index]} — 정답`);
        } else if (index === selected) {
          button.classList.add("wrong");
          button.querySelector(".mark").textContent = "×";
          button.setAttribute("aria-label", `${item.options[index]} — 오답`);
        }
      });
      $("feedback").className = `feedback ${correct ? "good" : "bad"}`;
      $("feedback").replaceChildren();
      const heading = document.createElement("strong");
      heading.textContent = correct ? "정답이에요! 정말 멋져요." : `아쉬워요! 정답: ${item.options[item.answer]}`;
      $("feedback").append(heading, document.createTextNode(item.fact));
      $("feedback").hidden = false;
      $("status").textContent = correct ? "지식도 반짝, 당신도 반짝." : "발견은 호기심에서 시작돼요.";
      updateProgress(current + 1);
      $("next").disabled = false;
      $("next").focus({ preventScroll: true });
    }

    function showResults() {
      $("quiz").hidden = true;
      $("results").hidden = false;
      $("question-count").innerHTML = "<strong>탐험 완료</strong><span class=\"total\"> / 10문제 모두 완료</span>";
      const reaction = score === 10 ? ["🏆", "당신은 우주 퀴즈의 전설!", "완벽한 탐험이었어요. 우주도 당신의 실력에 감탄할 거예요."] :
        score >= 7 ? ["🚀", "당신은 멋진 우주 탐험가!", "우주를 향한 호기심이 당신을 더 먼 곳으로 이끌 거예요."] :
        score >= 4 ? ["🧑‍🚀", "우주 탐험가로 성장 중!", "멋진 출발이에요. 아직 발견할 우주가 가득 남아 있어요."] :
        ["🔭", "당신의 탐험은 이제 시작!", "모든 발견은 질문에서 시작돼요. 오늘도 새로운 것을 배웠네요."];
      $("reaction").textContent = reaction[0];
      $("result-title").textContent = reaction[1];
      $("result-copy").textContent = reaction[2];
      $("result-number").innerHTML = `${score}<span> / ${questions.length}</span>`;
      $("correct-count").textContent = score;
      $("wrong-count").textContent = questions.length - score;
      $("accuracy").textContent = `${score / questions.length * 100}%`;
      $("result-title").focus({ preventScroll: true });
    }

    $("next").addEventListener("click", () => {
      if (!answered) return;
      if (current === questions.length - 1) showResults();
      else { current++; showQuestion(true); }
    });
    $("restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      $("results").hidden = true;
      $("quiz").hidden = false;
      updateProgress(0);
      showQuestion(true);
    });
    showQuestion();
  </script>
</body>
</html>
